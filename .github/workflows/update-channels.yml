name: Update channel list
on:
  schedule:
    - cron: '17 3 * * 1'   # every Monday
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download database
        run: |
          mkdir -p api-cache
          for f in streams channels feeds logos countries categories languages blocklist; do
            curl -fsSL -o api-cache/$f.json https://iptv-org.github.io/api/$f.json
          done
      - name: Check every stream
        run: python3 scripts/probe.py api-cache/streams.json probe.json
      - name: Build data/channels.json
        run: node scripts/build-data.mjs --from api-cache --probe probe.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/channels.json
          git diff --cached --quiet || git commit -m "Update channel list"
          git push
